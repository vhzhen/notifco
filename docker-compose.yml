# notifco local + free-tier deployment stack.
#
# Everything self-hosted, nothing billable. This is what runs on the Oracle
# Always Free VM (see deploy/oracle/README.md).
#
#   cp .env.sample .env    # fill in DISCORD_TOKEN, DISCORD_APP_ID
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notifco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifco}
      POSTGRES_DB: notifco
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on localhost only. The bot reaches Postgres over the compose
    # network, so there is no reason to expose it to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifco -d notifco"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Modest limits: the whole point is to fit a small free VM.
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Differ state is a cache, not a system of record: losing it costs one poll
    # cycle of detection and can never cause a duplicate notification. So
    # persistence is deliberately minimal.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192M

  notifco:
    build: .
    restart: unless-stopped
    command: ["all"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://notifco:${POSTGRES_PASSWORD:-notifco}@postgres:5432/notifco?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_APP_ID: ${DISCORD_APP_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Leave UW_API_KEY empty to run on fixtures instead of live data.
      UW_API_KEY: ${UW_API_KEY:-}
      NOTIFCO_SOURCE: ${NOTIFCO_SOURCE:-}
      NOTIFCO_POLL_INTERVAL: ${NOTIFCO_POLL_INTERVAL:-60s}
      NOTIFCO_HOT_INTERVAL: ${NOTIFCO_HOT_INTERVAL:-15s}
      NOTIFCO_RATE_LIMIT: ${NOTIFCO_RATE_LIMIT:-120}
      NOTIFCO_COOLDOWN: ${NOTIFCO_COOLDOWN:-30m}
      METRICS_ADDR: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Metrics on localhost only: it is an unauthenticated endpoint and has no
    # business being reachable from the internet.
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
