name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets are needed: CI runs entirely against the mock source backed by
# real captured API responses. That is the point of the CourseSource interface.
permissions:
  contents: read

jobs:
  test:
    name: build, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifco
          POSTGRES_PASSWORD: notifco
          POSTGRES_DB: notifco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifco -d notifco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://notifco:notifco@localhost:5432/notifco_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
      REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Must satisfy the `go` directive in go.mod. Pinning it avoids
          # relying on GOTOOLCHAIN auto-download at build time.
          go-version: '1.27'
          cache: true

      - name: Verify module checksums
        run: go mod verify

      - name: gofmt
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # Advisory, not blocking. staticcheck trails new Go releases: it cannot
        # read export data from a toolchain newer than it supports and fails
        # with "export data version 5 is greater than maximum supported
        # version 4". go vet above is the blocking lint.
        continue-on-error: true
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: Build
        run: go build -trimpath ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Load test (10k subscriptions)
        run: go test -tags=load -count=1 -v -timeout=600s ./test/load/

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t notifco:ci .


  # Continuous deployment. Runs only for pushes to main, and only after the
  # tests and the docker build both pass; pull requests never deploy.
  #
  # The binary is cross-compiled here on the runner, never on the VM: the
  # e2-micro has 1 GB of RAM and cannot compile Go (see deploy/gcp/README.md).
  # The VM only receives the binary, fast-forwards its checkout (for compose
  # files), and rebuilds the tiny runtime image.
  #
  # Required repository secrets (Settings -> Secrets and variables -> Actions):
  #   DEPLOY_HOST         VM external IP or hostname
  #   DEPLOY_USER         SSH user on the VM
  #   DEPLOY_SSH_KEY      private key whose public half is in the VM's authorized_keys
  #   DEPLOY_KNOWN_HOSTS  pinned host key line(s) for DEPLOY_HOST (ssh-keyscan output)
  deploy:
    name: deploy to VM
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits rather than cancelling a
    # half-finished rollout.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Check deploy secrets
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for v in DEPLOY_HOST DEPLOY_USER KEY KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing deploy secret for $v (see the comment above the deploy job in ci.yml)"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Cross-compile linux/amd64
        run: make dist-linux

      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host vm
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          CFG

      - name: Upload binary
        run: |
          scp dist/notifco-linux-amd64 vm:notifco/dist/notifco-linux-amd64.new

      - name: Roll out
        run: |
          ssh vm 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/notifco
          git pull --ff-only
          mv dist/notifco-linux-amd64.new dist/notifco-linux-amd64
          chmod +x dist/notifco-linux-amd64
          sudo docker compose \
            -f docker-compose.yml \
            -f docker-compose.gcp.yml \
            -f docker-compose.prebuilt.yml \
            up -d --build
          sudo docker image prune -f >/dev/null
          REMOTE

      - name: Verify
        run: |
          for i in $(seq 1 30); do
            if ssh vm 'curl -fsS localhost:9090/healthz' >/dev/null 2>&1; then
              echo "healthy after ${i} attempt(s)"
              ssh vm 'sudo docker ps --format "{{.Names}} {{.Status}}"' || true
              exit 0
            fi
            sleep 4
          done
          echo "::error::notifco did not become healthy within 2 minutes"
          ssh vm 'sudo docker logs --tail 50 notifco-notifco-1' || true
          exit 1
